name: Android package and emulator smoke

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android-premiere/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'apktool.yml'
      - '.github/workflows/android-package.yml'
  pull_request:
    paths:
      - 'android-premiere/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'apktool.yml'
      - '.github/workflows/android-package.yml'

permissions:
  contents: read

concurrency:
  group: android-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Pinned dependency build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30'
      - uses: actions/cache@v4
        with:
          path: |
            android-premiere/tools/build-tools_r36_linux.zip
            android-premiere/tools/platform-tools_r37.0.1-linux.zip
            android-premiere/tools/VLC-Android-3.7.1-*.apk
            android-premiere/baseline/original-arm64-decoded
          key: premiere-base-3.7.1-apktool3.0.3-${{ hashFiles('android-premiere/DEPENDENCIES.json') }}
      - name: Install checksum-verified Apktool 3.0.3 and Android API 30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-premiere/tools
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            -o android-premiere/tools/apktool.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  android-premiere/tools/apktool.jar' | sha256sum -c -
          cp "$ANDROID_SDK_ROOT/platforms/android-30/android.jar" android-premiere/tools/android.jar
          java -jar android-premiere/tools/apktool.jar --version
      - name: Verify and extract pinned engine dependencies
        run: python3 android-premiere/scripts/fetch_dependencies.py
      # Publishing must reuse the original private signing key. PR checks stay
      # development-signed and never receive production credentials.
      - name: Load stable, pinned release signing identity
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          contains(github.event.head_commit.message, '[publish-premiere]')
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.PREMIERE_RELEASE_KEYSTORE_B64 }}
          RELEASE_PASSWORD: ${{ secrets.PREMIERE_RELEASE_PASSWORD }}
          RELEASE_ALIAS: ${{ secrets.PREMIERE_RELEASE_ALIAS }}
          RELEASE_CERT_SHA256: ${{ secrets.PREMIERE_RELEASE_CERT_SHA256 }}
          RELEASE_GATE_TOKEN: ${{ secrets.PREMIERE_RELEASE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for setting in RELEASE_KEYSTORE_B64 RELEASE_PASSWORD RELEASE_ALIAS RELEASE_CERT_SHA256 RELEASE_GATE_TOKEN; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Required release signing secret is missing: $setting"
              exit 1
            fi
          done
          umask 077
          mkdir -p android-premiere/signing
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > android-premiere/signing/release.p12
          printf '%s' "$RELEASE_PASSWORD" > android-premiere/signing/release-password.txt
          {
            echo "PREMIERE_RELEASE_KEYSTORE=$GITHUB_WORKSPACE/android-premiere/signing/release.p12"
            echo "PREMIERE_RELEASE_PASSWORD_FILE=$GITHUB_WORKSPACE/android-premiere/signing/release-password.txt"
            echo "PREMIERE_RELEASE_ALIAS=$RELEASE_ALIAS"
            echo "PREMIERE_RELEASE_CERT_SHA256=$RELEASE_CERT_SHA256"
            echo "PREMIERE_RELEASE_STAGE=publication"
          } >> "$GITHUB_ENV"
      - name: Build both signed APK variants
        shell: bash
        env:
          PREMIERE_RELEASE_GITHUB_TOKEN: ${{ secrets.PREMIERE_RELEASE_GITHUB_TOKEN }}
        run: bash android-premiere/scripts/build.sh
      - name: Verify signing, checksums and outputs
        shell: bash
        run: |
          set -euo pipefail
          cd android-premiere/dist
          sha256sum -c SHA256SUMS
          test -s VLC-Premiere-arm64.apk
          test -s VLC-Premiere-Universal.apk
          test -s SHA256SUMS
      - name: Refuse release if it cannot upgrade the latest installed APK
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          contains(github.event.head_commit.message, '[publish-premiere]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="android-premiere/build/previous-release"
          mkdir -p "$previous"
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern 'VLC-Premiere-arm64.apk' --dir "$previous"
          prior="$previous/VLC-Premiere-arm64.apk"
          test -s "$prior"
          java -jar android-premiere/tools/build-tools/android-16/lib/apksigner.jar \
            verify --print-certs "$prior" > "$previous/certificate.txt"
          aapt2="android-premiere/tools/build-tools/android-16/aapt2"
          "$aapt2" dump badging "$prior" > "$previous/badging.txt"
          "$aapt2" dump badging android-premiere/dist/VLC-Premiere-arm64.apk \
            > "$previous/new-arm64.txt"
          "$aapt2" dump badging android-premiere/dist/VLC-Premiere-Universal.apk \
            > "$previous/new-universal.txt"
          python3 android-premiere/scripts/verify_release_upgrade.py \
            --artifacts android-premiere/build/artifacts.json \
            --old-certificate "$previous/certificate.txt" \
            --old-badging "$previous/badging.txt" \
            --new-arm64-badging "$previous/new-arm64.txt" \
            --new-universal-badging "$previous/new-universal.txt"
      - name: Verify VLC-bundled AndroidX runtime for RecyclerView migration
        run: python3 android-premiere/scripts/verify_androidx_runtime.py
      - name: Upload CI-only test packages and provenance
        uses: actions/upload-artifact@v4
        with:
          name: premiere-ci-test-packages
          if-no-files-found: error
          retention-days: 7
          path: |
            android-premiere/dist/VLC-Premiere-arm64.apk
            android-premiere/dist/VLC-Premiere-Universal.apk
            android-premiere/dist/SHA256SUMS
            android-premiere/build/artifacts.json
            android-premiere/build/native-source-manifest.json
            android-premiere/tools/dependency-provenance.json
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: premiere-build-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            android-premiere/build/build.log
            android-premiere/build/*.json

  android16:
    name: Android 16 permission and media acceptance
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: premiere-ci-test-packages
          path: android-premiere
      - name: Install FFmpeg and prepare media fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 android-premiere/scripts/prepare_smoke_fixtures.py
      - name: Enable Linux KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "KVM device diagnostics:"
          ls -l /dev/kvm || true
          id
          # udev may not reapply permissions to an already-present KVM device
          # on GitHub hosted runners; explicitly grant access before validation.
          test -c /dev/kvm || { echo "::error::KVM device unavailable on runner"; exit 1; }
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm || { echo "::error::KVM is not accessible"; exit 1; }
          echo "KVM access enabled for Android 16 hardware acceleration"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash android-premiere/scripts/android16_acceptance.sh
      - name: Preserve Android 16 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premiere-android16-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            android-premiere/build/notification-smoke/
            android-premiere/build/smoke/

  # Release only from a marked master commit, after upgrade identity and emulator checks.
  publish_release:
    name: Publish upgrade-compatible APK release
    needs: [package, android16]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      contains(github.event.head_commit.message, '[publish-premiere]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: premiere-ci-test-packages
          path: release
      - name: Check APK checksums and publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release/dist
          # Prevent a regression that publishes a fresh, unrelated development key.
          python3 - <<'PY'
          import json
          from pathlib import Path
          artifacts=json.loads(Path("../build/artifacts.json").read_text())
          if len(artifacts)!=2 or any(x.get("signing_mode")!="release" for x in artifacts):
              raise SystemExit("Release blocked: unsigned or development-signed APK")
          if len({x.get("certificate_sha256") for x in artifacts})!=1:
              raise SystemExit("Release blocked: APK variants have different signing certificates")
          PY
          sha256sum -c SHA256SUMS
          test -s VLC-Premiere-arm64.apk
          test -s VLC-Premiere-Universal.apk
          tag="premiere-$(date -u +%Y.%m.%d)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag="${tag}-${GITHUB_SHA:0:7}"
          fi
          cat > RELEASE_NOTES.md <<EOF
          VLC Première — upgrade-safe release and persistent artwork.

          - Preserved video posters and music covers in durable app-private storage, migrating the old cache on first access.
          - Kept the TMDB token and user settings during a compatible in-place APK update.
          - Verified that both APK variants retain the prior release certificate, package identity, and a newer versionCode.
          - Preserved automatic video/audio library rescanning on launch.

          ## Downloads
          - **VLC-Premiere-arm64.apk:** for ARM64 phones.
          - **VLC-Premiere-Universal.apk:** for ARM64, ARMv7, x86, and x86_64.
          - **SHA256SUMS:** checksums to verify the two files.

          Install over the prior compatible VLC Première version without uninstalling to retain
          private TMDB credentials and artwork. The release gate checked the previous published
          APK certificate and increasing versionCode. These packages cannot update official VLC
          or earlier Première installations signed with a different certificate.

          Both variants were built with the pinned production key and checksums verified on
          the merged master commit. Android 16 emulator acceptance must pass before publication.

          Source commit: `$GITHUB_SHA`
          EOF
          gh release create "$tag" \
            VLC-Premiere-arm64.apk VLC-Premiere-Universal.apk SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VLC Première — ${tag#premiere-}" \
            --notes-file RELEASE_NOTES.md \
            --latest
