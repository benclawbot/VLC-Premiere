name: Video player checks

on:
  push:
    paths:
      - 'android-premiere/native/**'
      - 'android-premiere/tests/VideoSeekTest.java'
      - '.github/workflows/video-player-checks.yml'
  pull_request:
    paths:
      - 'android-premiere/native/**'
      - 'android-premiere/tests/VideoSeekTest.java'
      - '.github/workflows/video-player-checks.yml'

permissions:
  contents: read

jobs:
  video-player:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run pure-Java seek regression tests
        run: |
          mkdir -p /tmp/vlc-premiere-tests
          javac -d /tmp/vlc-premiere-tests \
            android-premiere/native/org/videolan/vlc/premiere/VideoSeek.java \
            android-premiere/tests/VideoSeekTest.java
          java -cp /tmp/vlc-premiere-tests org.videolan.vlc.premiere.VideoSeekTest
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30'
      - name: Compile all native Java UI sources
        run: |
          mkdir -p /tmp/vlc-premiere-classes
          find android-premiere/native -name '*.java' -print0 | xargs -0 javac \
            -source 8 -target 8 \
            -classpath "$ANDROID_SDK_ROOT/platforms/android-30/android.jar" \
            -d /tmp/vlc-premiere-classes
