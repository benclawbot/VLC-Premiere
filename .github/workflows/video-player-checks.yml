name: Video player checks

on:
  push:
    paths:
      - 'android-premiere/native/**'
      - 'android-premiere/scripts/check_premiere_locales.py'
      - 'res/values*/premiere_strings.xml'
      - 'res/values*/premiere_plurals.xml'
      - 'android-premiere/tests/**'
      - '.github/workflows/video-player-checks.yml'
  pull_request:
    paths:
      - 'android-premiere/native/**'
      - 'android-premiere/scripts/check_premiere_locales.py'
      - 'res/values*/premiere_strings.xml'
      - 'res/values*/premiere_plurals.xml'
      - 'android-premiere/tests/**'
      - '.github/workflows/video-player-checks.yml'

permissions:
  contents: read

jobs:
  video-player:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check translated Android resources
        run: python3 android-premiere/scripts/check_premiere_locales.py
      - name: Test production signing configuration safeguards
        run: python3 -m unittest discover -s android-premiere/tests -p 'test_signing_config.py'
      - name: Run pure-Java player regression tests
        run: |
          mkdir -p /tmp/vlc-premiere-tests
          javac -Xlint:all -Werror -d /tmp/vlc-premiere-tests \
            android-premiere/native/org/videolan/vlc/premiere/VideoSeek.java \
            android-premiere/native/org/videolan/vlc/premiere/PlaybackUX.java \
            android-premiere/native/org/videolan/vlc/premiere/SeriesUX.java \
            android-premiere/native/org/videolan/vlc/premiere/LibraryPosition.java \
            android-premiere/tests/VideoSeekTest.java \
            android-premiere/tests/PlaybackUXTest.java \
            android-premiere/tests/SeriesUXTest.java \
            android-premiere/tests/LibraryPositionTest.java
          java -cp /tmp/vlc-premiere-tests org.videolan.vlc.premiere.VideoSeekTest
          java -cp /tmp/vlc-premiere-tests org.videolan.vlc.premiere.PlaybackUXTest
          java -cp /tmp/vlc-premiere-tests org.videolan.vlc.premiere.SeriesUXTest
          java -cp /tmp/vlc-premiere-tests org.videolan.vlc.premiere.LibraryPositionTest
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30'
      - name: Compile all native Java UI sources
        run: |
          mkdir -p /tmp/vlc-premiere-classes
          find android-premiere/native -name '*.java' -print0 | xargs -0 javac \
            -source 8 -target 8 \
            -classpath "$ANDROID_SDK_ROOT/platforms/android-30/android.jar" \
            -d /tmp/vlc-premiere-classes
